<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank App</title>
  <link rel="stylesheet" href="bank.css">
</head>
<body>
  <div class="app">
    <h1>Bank App</h1>
    <div class="input-group">
      <label>Enter Transaction Amount</label>
      <input type="number" id="amount">
    </div>
    <div class="buttons">
      <button class="credit" onclick="creditAmount()">Credit</button>
      <button class="debit" onclick="debitAmount()">Debit</button>
    </div>
    <p class="balance">
      Your Account Balance is : Rs.<span id="balance">0</span>
    </p>
  </div>
  <script src="bank.js"></script>
</body>
</html>
