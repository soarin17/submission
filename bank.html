<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bank App</title>
  <link rel="stylesheet" href="bank.css">
</head>
<body>

  <div class="app">
    <h1>Bank App</h1>

    <div class="input-group">

  </div>

</body>
</html>
